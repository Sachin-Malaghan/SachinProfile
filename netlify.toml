# Netlify: the website is the site/ folder. No build step: it is plain HTML, JS and media.
[build]
  publish = "site"
  command = ""

[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
